<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scheletro dell'app</title>
<!-- Pagina di sviluppo, non una schermata dell'app: le misure di src/ui/schermate/partita-misure.css, zona per zona, con la
     misura vera presa dall'app. La seconda pagina di Vite (vite.config.ts); il codice è in scheletri.ts. -->
</head>
<body>
<h1>Scheletro dell'app</h1>
<p class="intro" id="intro"></p>
<div class="comandi">
  <div class="gruppo" role="group" aria-label="Formato dello schermo" id="scelta-formato"><span>Formato:</span></div>
  <div class="gruppo" role="group" aria-label="Turno" id="scelta-turno"><span>Turno:</span></div>
  <div class="gruppo" role="group" aria-label="Unità di misura" id="scelta-unita"><span>Unità di misura:</span></div>
  <div class="gruppo" role="group" aria-label="Scala del disegno" id="scelta-scala"><span>Scala del disegno:</span></div>
  <div class="gruppo" role="group" aria-label="Livelli del disegno" id="scelta-livelli"><span>Livelli:</span></div>
  <div class="gruppo" role="group" aria-label="Trasparenza dello scheletro sull'app">
    <label for="trasparenza">Scheletro</label>
    <input type="range" id="trasparenza" min="0" max="100" value="0" aria-describedby="trasp-valore">
    <label for="trasparenza">App</label> <output id="trasp-valore">0%</output>
  </div>
</div>
<p class="stato" id="stato" role="status"></p>
<div class="pagina">
  <main id="zone"></main>
  <aside class="disegno" aria-label="Disegno dello schermo"><div id="schermo-posto"></div><p class="info" id="info" aria-live="polite"></p></aside>
</div>
<script type="module" src="./scheletri.ts"></script>
</body>
</html>

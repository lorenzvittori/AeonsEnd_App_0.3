<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101116">
<title>Aeons End App - new design 0.2</title>
<!-- App installabile (schermata Home, a tutto schermo) -->
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/Assets/ui/app-icons/apple-touch-icon.png?v=198">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Aeon's End">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Fondo scuro e pagina nascosta finché i CSS non sono caricati (evita lampi bianchi) -->
<style>
  html { background: #101116; }
  html:not(.ready) body { visibility: hidden; }
</style>
</head>
<body>
  <!-- Schermata "partita": una sola schermata per turno giocatori, turno nemesi, passo Pesca e "Crea mazzo", divisa in
       7 zone dall'alto in basso (data-zona). Disposizione: src/ui/schermate/partita.css (griglia, una riga per zona);
       misure: src/ui/schermate/partita-misure.css. data-turno (giocatori | nemesi | pesca | crea-mazzo) è il momento della
       partita: lo imposta il coordinatore (src/ui/navigazione.ts) da variantePartita() (src/ui/partita-variante.ts). -->
  <div class="ae-shell" id="app" data-schermata="partita" data-turno="giocatori">
    <!-- 1 testata: mazzo e scarti, nome della nemesi con battaglia, giocatori e turno, Menu -->
    <header class="ae-header" id="topbar" data-zona="testata">
      <div class="ae-header-piles" id="pile-testata">
        <div class="ae-pile ae-pile--deck" id="pila-mazzo" role="button" tabindex="0"></div>
        <button class="ae-pile ae-pile--discard" id="pila-scarti" type="button"></button>
      </div>
      <button id="undo-btn" class="ae-icon-button" type="button" data-testo-aria="undoAriaLabel" data-testo-title="cancel" disabled hidden>
        <span class="ae-icon ae-icon--undo" aria-hidden="true"></span>
      </button>
      <span id="phase-label" class="ae-phase" data-testo="playersTurn"></span>
      <button id="menu-btn" class="ae-icon-button ae-menu-button" type="button" data-testo-aria="menu" aria-haspopup="dialog"><span class="ae-menu-lines"></span></button>
    </header>

    <!-- Zone 2-6 (sottogriglia della schermata) -->
    <main class="ae-main" id="main">
      <!-- 2 fascia turno: la barra del mazzo dei turni (src/ui/componenti/barra-turni.ts) -->
      <div class="ae-turn-track" id="fascia-turno" data-zona="turno" role="button" tabindex="0"></div>

      <!-- 3 fascia carte piccole: le carte in gioco in piccolo, uguale nei due turni -->
      <div data-zona="carte-piccole">
        <div id="rail" class="ae-compact-rail" role="list" data-testo-aria="queueRail"></div>
      </div>

      <!-- 4 vite di Gravehold e della nemesi (box creati da src/ui/componenti/vite.ts) -->
      <div data-zona="vite">
        <div class="ae-lives" id="vite"></div>
      </div>

      <!-- 5 fascia carte grandi: la coda del turno giocatori (#queue) o il carosello del turno nemesi (#focus) -->
      <section data-zona="carte-grandi" id="carte-grandi" data-testo-aria="zonaCarteGrandiGiocatori">
        <div id="queue" class="ae-queue-viewport">
          <div id="queue-list" class="ae-queue-list" role="list"></div>
          <div id="queue-empty" class="ae-empty" hidden>
            <img class="ae-empty-icon" src="Assets/ui/icons/empty-deck.svg" alt="" width="56" height="56">
            <strong data-testo="queueEmptyTitle"></strong>
            <p data-testo="emptyHintStart"></p>
          </div>
        </div>
        <div id="focus" class="ae-focus" hidden></div>
      </section>

      <!-- 6 pulsanti interattivi: fascia fissa con i comandi della carta al centro, solo nel turno giocatori -->

      <div data-zona="interattivi" id="interattivi"></div>
    </main>

    <!-- 7 pulsante principale: uno solo (testo e azione da variantePartita), con "Annulla modifiche" accanto, il cursore di
         "Crea mazzo" al suo posto e la scelta del giocatore 1/2 o 3/4 ridotta -->
    <footer class="ae-dock" id="dock" data-zona="principale">
      <div class="ae-main-row">
        <button id="annulla-modifiche" class="ae-button ae-button--secondary ae-cancel-drafts" type="button" data-testo="cancelChanges" hidden></button>
        <button id="pulsante-principale" class="ae-button ae-button--primary ae-button--full" type="button" data-testo="drawTurnCard"></button>
      </div>
      <div class="ae-pair-dock" id="scelta-coppia" role="group" hidden></div>
    </footer>
  </div>

  <!-- Pagina iniziale: giocatori, nemesi, carte base potenziate, riprendi / nuova partita -->
  <div id="start" class="start-screen">
    <div class="start-box">
      <h1 class="start-title">Aeon's End<span class="start-subtitle">Nemesis Companion</span></h1>

      <section class="start-group" aria-labelledby="players-label">
        <h2 id="players-label" class="start-label" data-testo="playersTitle"></h2>
        <div class="choices" id="choices-players" role="group" aria-labelledby="players-label"></div>
      </section>

      <section class="start-group" aria-labelledby="nemesis-label">
        <h2 id="nemesis-label" class="start-label" data-testo="nemesisWord"></h2>
        <label class="visually-hidden" for="wave-select" data-testo="wave"></label>
        <select id="wave-select" class="ae-select"></select>
        <div id="nemesis-list" class="nemesis-list" role="group" aria-labelledby="nemesis-label"></div>
        <!-- Nemesi non disponibili: solo il nome, barrate, non cliccabili -->
        <ul id="nemesis-unavailable" class="nemesis-unavailable" data-testo-aria="unavailableNemeses" hidden></ul>
        <!-- Carta della nemesi scelta (solo se c'è l'immagine: Assets/nemesis/nemesis-art.json) -->
        <figure id="nemesis-preview" class="nemesis-preview" hidden><img alt="" decoding="async"></figure>
        <p id="nemesis-empty" class="start-note" data-testo="noNemesisInWave" hidden></p>
      </section>

      <div id="start-error" class="start-error" role="alert" hidden>
        <p id="start-error-text"></p>
        <button id="retry-btn" class="ae-button ae-button--secondary" type="button" data-testo="retry" hidden></button>
      </div>

      <div class="start-actions">
        <button id="resume-btn" class="ae-button ae-button--primary ae-button--full" type="button" data-testo="resumeGame" hidden></button>
        <button id="start-btn" class="ae-button ae-button--primary ae-button--full" type="button" data-testo="startNew" disabled></button>
      </div>
    </div>
  </div>

  <!-- Pila degli scarti (drawer) -->
  <div id="discard" class="ae-drawer-backdrop" hidden>
    <aside class="ae-drawer" role="dialog" aria-modal="true" aria-labelledby="discard-title">
      <div class="ae-drawer-header">
        <h2 id="discard-title" class="ae-drawer-title"></h2>
        <button id="discard-close" class="ae-text-button" type="button" data-testo="close"></button>
      </div>
      <div class="ae-drawer-body">
        <div id="discard-grid" class="ae-discard-grid"></div>
        <div id="discard-empty" class="ae-empty" hidden>
          <span class="ae-icon ae-icon--discard discard-empty-icon" aria-hidden="true"></span>
          <strong data-testo="discardEmpty"></strong>
        </div>
      </div>
    </aside>
  </div>

  <!-- Dialoghi (carta della coda, carta degli scarti, conferma nuova partita) -->
  <div id="dialog-root"></div>

  <!-- Messaggi: toast visibile e annunci per lettori di schermo -->
  <div id="toast-root" role="status" aria-live="polite"></div>
  <div id="live" class="visually-hidden" aria-live="polite"></div>

  <!--
    Codice e stili: src/main.ts (Vite). Con `npm run build` diventano file in app/ con un hash nel nome, e questo
    index.html li carica direttamente.
    I percorsi che iniziano con / sono file di public/: Vite aggiunge il percorso del sito (vite.config.ts, base).
  -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>

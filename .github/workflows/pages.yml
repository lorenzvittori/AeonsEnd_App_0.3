# Pubblica il sito su GitHub Pages a ogni push su main (o a mano da Actions → "Pubblica il sito" → Run workflow, solo
# su main). Il sito si COSTRUISCE con Vite: npm ci, controlli, test, npm run build, e si pubblica dist/. Si lavora sul branch
# sviluppo, che non pubblica; main riceve sviluppo solo quando l'utente scrive "pubblica" (git push origin sviluppo:main).
# I branch ts e main-v273 (la v273 senza build) restano per riferimento.
#
# Cache di index.html: GitHub Pages lo tiene in cache circa 10 minuti, e i file di Vite hanno un hash nel nome che cambia
# a ogni pubblicazione. Per non rompere un index.html vecchio, prima di pubblicare si portano in dist/app/ anche i
# file delle ultime pubblicazioni (tools/pubblicazione-precedente.mjs). Il primo passaggio dal sito senza build è coperto
# da public/script.js (ricarica la pagina se arriva un index.html vecchio).
#
# Perché un workflow nostro: la pubblicazione automatica di GitHub ogni tanto si blocca e resta ferma fino al suo
# limite di 10 minuti, poi fallisce (e arriva la mail di errore); ripubblicando subito dopo, di solito va in ~30 s.
# Qui ogni tentativo ha un limite di 3 minuti e, se si blocca, ne parte un altro, fino a 3 in tutto.
#
# Richiede: Settings → Pages → Build and deployment → Source = "GitHub Actions".

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; un push nuovo aspetta che finisca quella in corso (non la interrompe)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Anche lanciato a mano, si pubblica solo main
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Pacchetti
        run: npm ci

      - name: Controlli (tsc e moduli)
        run: npm run check

      - name: Test
        run: npm test

      - name: Costruzione del sito (dist/)
        run: npm run build

      - name: File delle pubblicazioni precedenti (index.html vecchi ancora in cache)
        run: node tools/pubblicazione-precedente.mjs https://lorenzvittori.github.io/AeonsEnd_App_0.2/ dist

      - run: du -sh dist

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - name: Pubblica (tentativo 1)
        id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Pubblica (tentativo 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Pubblica (tentativo 3)
        id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000

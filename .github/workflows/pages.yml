# Pubblica il sito su GitHub Pages a ogni push su main (o a mano da Actions → "Pubblica il sito" → Run workflow).
#
# Perché un workflow nostro: la pubblicazione automatica di GitHub ogni tanto si blocca e resta ferma fino al suo
# limite di 10 minuti, poi fallisce (e arriva la mail di errore); ripubblicando subito dopo, di solito va in ~30 s.
# Qui ogni tentativo ha un limite di 3 minuti (il doppio della pubblicazione riuscita più lenta vista finora) e, se si
# blocca, ne parte un altro, fino a 3 in tutto. La mail di errore arriva solo se falliscono tutti e tre.
#
# Richiede: Settings → Pages → Build and deployment → Source = "GitHub Actions".

name: Pubblica il sito

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Una pubblicazione alla volta; un push nuovo aspetta che finisca quella in corso (non la interrompe)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Solo i file che servono al sito (niente tools/, README, .gitignore)
      - name: Prepara i file del sito
        run: |
          mkdir _site
          cp index.html script.js style.css version.json cards.json deck-setup.json nemesis.json sw.js manifest.webmanifest _site/
          cp -r css Assets Data thumbs _site/
          du -sh _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.try1.outputs.page_url || steps.try2.outputs.page_url || steps.try3.outputs.page_url }}
    steps:
      - name: Pubblica (tentativo 1)
        id: try1
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Pubblica (tentativo 2)
        id: try2
        if: steps.try1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true
        with:
          timeout: 180000

      - name: Pubblica (tentativo 3)
        id: try3
        if: steps.try1.outcome == 'failure' && steps.try2.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 180000
